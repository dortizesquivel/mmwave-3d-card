name: Release

# Run it from Actions → Release → Run workflow, or:
#   gh workflow run release.yml -f bump=patch        (patch | minor | major)
# It tests, bumps package.json, rebuilds dist/, updates CHANGELOG.md, commits, tags
# and publishes a GitHub release with the card attached (HACS installs from it), with a signed
# build-provenance attestation for that file.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: Pre-release (HACS only offers it with beta versions enabled)
        type: boolean
        default: false
      dry_run:
        description: Dry run (build and show the notes, publish nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release (the commit and tag go in with the deploy key)
      id-token: write        # sign the build-provenance attestation
      attestations: write    # store it with the repository
    env:
      BUMP: ${{ inputs.bump }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # main is protected: the release commit goes in with the deploy key, the ruleset's only bypass.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Bump version
        id: version
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Release notes and changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release-notes.mjs "$TAG" --dry-run
          else
            node scripts/release-notes.mjs "$TAG"
          fi

      - name: Commit and tag
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist/ CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main "$TAG"

      # Proves the released file was built by this workflow from this commit:
      #   gh attestation verify mmwave-3d-card.js --repo dortizesquivel/mmwave-3d-card
      - name: Attest build provenance
        id: attest
        if: inputs.dry_run == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/mmwave-3d-card.js

      - name: Publish GitHub release
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The attestation also goes with the release: the Sigstore bundle, and its signed in-toto statement.
          cp "$BUNDLE" mmwave-3d-card.js.sigstore.json
          jq -c '.dsseEnvelope' "$BUNDLE" > mmwave-3d-card.js.intoto.jsonl
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/mmwave-3d-card.js mmwave-3d-card.js.sigstore.json mmwave-3d-card.js.intoto.jsonl \
            --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run for **$TAG**: nothing was committed or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
          fi
