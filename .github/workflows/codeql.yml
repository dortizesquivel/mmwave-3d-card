name: CodeQL

# Static security analysis of the card's JavaScript and of these workflows, with GitHub's extended query set:
# on every pull request, on main and every week. Findings show under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # dist/ is the bundle built from src/ (with three.js inside); the source is what gets reviewed.
          config: |
            paths-ignore:
              - dist
              - node_modules
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
