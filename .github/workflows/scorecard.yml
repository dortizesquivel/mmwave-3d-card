name: OpenSSF Scorecard

# The OpenSSF Scorecard checks the project's security practices (branch protection, CI, code review, token
# permissions, dependency updates, static analysis…) and publishes the score behind the README badge.
# Results also show under Security → Code scanning.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to the public Scorecard API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
