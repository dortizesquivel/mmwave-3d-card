name: Screenshot baselines

# By hand, after an intentional visual change: runs the browser tests and commits the regenerated
# screenshot baselines (made on this Linux runner) to main. The tests themselves run in the CI workflow.
#   gh workflow run browser.yml -f update_screenshots=true
on:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Regenerate the screenshot baselines and commit them
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the new baselines (with the deploy key)
    env:
      UPDATE: ${{ inputs.update_screenshots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # main is protected: the new baselines go in with the deploy key, the ruleset's only bypass.
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          if [ "$UPDATE" = "true" ]; then
            node_modules/.bin/playwright test --update-snapshots
          else
            node_modules/.bin/playwright test
          fi

      - name: Commit updated baselines
        if: inputs.update_screenshots && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/browser/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update screenshot baselines"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
