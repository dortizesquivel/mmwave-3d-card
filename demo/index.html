<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmWave 3D Card · demo</title>
<style>
  /* Home Assistant's default theme variables, so the card renders as it would on a dashboard. */
  :root {
    --primary-background-color: #fafafa; --card-background-color: #ffffff; --primary-text-color: #212121;
    --secondary-text-color: #727272; --disabled-text-color: #bdbdbd; --divider-color: rgba(0, 0, 0, .12);
    --primary-color: #03a9f4; --text-primary-color: #ffffff; --error-color: #db4437;
  }
  :root[data-theme="dark"] {
    --primary-background-color: #111111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b; --disabled-text-color: #6f6f6f; --divider-color: rgba(225, 225, 225, .12);
  }
  html, body { background: var(--primary-background-color); color: var(--primary-text-color); }
  body { margin: 0; font: 14px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  h1 { font-size: 18px; font-weight: 500; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .controls button { font: inherit; color: var(--primary-text-color); background: var(--card-background-color);
    border: 1px solid var(--divider-color); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; padding: 16px 20px; }
  details { margin: 0 20px 32px; padding: 12px 16px; border: 1px solid var(--divider-color); border-radius: 12px; background: var(--card-background-color); }
  summary { cursor: pointer; font-weight: 500; }
  .editor-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-top: 12px; }
  pre { margin: 0; padding: 12px; overflow: auto; font-size: 12px; background: var(--primary-background-color); border-radius: 8px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
    background: var(--primary-text-color); color: var(--card-background-color); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast[data-on="true"] { opacity: 1; }
  body.capture header, body.capture details { display: none; }
  body.capture main { padding: 12px; grid-template-columns: minmax(0, 1fr); }
  /* ?editor=1: the card and its editor side by side, as in HA's card editor dialog. */
  body.capture.with-editor { display: grid; grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
  body.capture.with-editor details { display: block; margin: 12px 12px 12px 0; }
  body.capture.with-editor #editor-box > summary, body.capture.with-editor #yaml { display: none; }
  body.capture.with-editor .editor-wrap { margin: 0; grid-template-columns: minmax(0, 1fr); }
  /* ?cursor=1: a visible pointer, because screen recordings don't show the mouse. */
  #cursor { position: fixed; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; z-index: 9999; pointer-events: none;
    background: rgba(255, 255, 255, .9); border: 2px solid rgba(0, 0, 0, .6); box-shadow: 0 1px 6px rgba(0, 0, 0, .45);
    transition: width .12s, height .12s, left .12s, top .12s, background .12s; }
  #cursor.down { width: 30px; height: 30px; left: -15px; top: -15px; background: rgba(3, 169, 244, .55); }
</style>
</head>
<body>
<header>
  <h1>mmWave 3D Card · simulated data</h1>
  <div class="controls">
    <button type="button" id="theme">Toggle theme</button>
    <button type="button" id="lang">Español / English</button>
    <button type="button" id="pause">Pause</button>
  </div>
</header>
<main id="cards"></main>
<details id="editor-box">
  <summary>Card editor (edits the first card)</summary>
  <div class="editor-wrap"><div id="editor"></div><pre id="yaml"></pre></div>
</details>
<div class="toast" id="toast"></div>

<script type="module">
  import './ha-card.js';
  import '../dist/mmwave-3d-card.js';
  import { LD6004_NODES, Sim } from './sim.js';

  // ?theme=dark&lang=es&cards=ld2450,ld6004,ceiling,ld2410&view=plan&capture=1
  // Tests add seed=<n> (deterministic noise), t=<s> (scene time) and frozen=1 (people stop moving).
  const q = new URLSearchParams(location.search);
  const ROOM = (dy) => ({
    walls: [[-3.2, 0 - dy], [3.4, 0 - dy], [3.4, 5.8 - dy], [-3.2, 5.8 - dy]],
    doors: [{ from: [3.4, 4.6 - dy], to: [3.4, 5.5 - dy] }],
    furniture: [
      { name: 'Desk', x: [-1.3, 0.5], y: [0.55 - dy, 1.15 - dy], height: 0.75 },
      { name: 'Sofa', x: [-2.9, -1.0], y: [3.7 - dy, 4.6 - dy], height: 0.45 },
      { name: 'Shelf', x: [2.9, 3.35], y: [0.4 - dy, 1.9 - dy], height: 1.8 },
    ],
  });
  const CARDS = {
    ld2450: { device: 'ld2450', prefix: 'kin_estudio_piscina', title: 'Study · HLK-LD2450', mount_height: 1.5 },
    ld6004: { device: 'ld6004', prefix: 'radar_ld6004', title: 'Study · HLK-LD6004', mount_height: 1.5,
      zone_service: 'esphome.hlk_ld6004_set_detection_zone', zone_names: ['Desk', 'Reading', 'Sofa'], room: ROOM(0) },
    ld2410: { device: 'ld2410', prefix: 'esp32_pasillo', title: 'Hallway · HLK-LD2410', mount_height: 1.5 },
    ceiling: { device: 'ld6004', prefix: 'radar_techo', title: 'Study · HLK-LD6004 on the ceiling', mount_height: 2.7,
      zone_service: 'esphome.hlk_techo_set_detection_zone', zone_names: ['Desk', 'Reading', 'Sofa'], room: ROOM(3) },
  };
  let dark = q.get('theme') === 'dark';
  let lang = q.get('lang') ?? 'en';
  let playing = !q.has('frozen');
  const seed = q.has('seed') ? Number(q.get('seed')) : undefined;
  document.body.classList.toggle('capture', q.has('capture'));
  document.body.classList.toggle('with-editor', q.has('editor'));
  if (q.has('editor')) document.getElementById('editor-box').open = true;
  if (q.has('cursor')) {
    const cursor = document.createElement('div');
    cursor.id = 'cursor';
    document.body.append(cursor);
    addEventListener('pointermove', (e) => { cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; }, true);
    addEventListener('pointerdown', () => cursor.classList.add('down'), true);
    addEventListener('pointerup', () => cursor.classList.remove('down'), true);
  }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

  const sim = new Sim({ seed, start: q.has('t') ? Number(q.get('t')) : 13 });
  const calls = [], moreInfo = [];
  const services = { esphome: Object.fromEntries(Object.keys(LD6004_NODES).flatMap((n) =>
    ['detection', 'interference', 'dwell'].map((k) => [`${n}_set_${k}_zone`, {}]))) };
  const hassFor = () => ({
    states: sim.states,
    themes: { darkMode: dark, theme: 'default' },
    locale: { language: lang },
    language: lang,
    user: { is_admin: true },
    services,
    callService: async (domain, service, data) => {
      calls.push({ domain, service, data });
      sim.callService(domain, service, data);
      setTimeout(push, 150);          // the sensor reports back shortly after
    },
    callWS: async (msg) => {
      if (msg.type !== 'history/history_during_period') throw new Error(`Unsupported ${msg.type}`);
      const end = Date.parse(msg.end_time), seconds = (end - Date.parse(msg.start_time)) / 1000;
      return Sim.history(msg.entity_ids, seconds, end, seed ?? 1);
    },
  });

  const cards = (q.get('cards') ?? 'ld2450,ld6004,ceiling,ld2410').split(',').map((key) => {
    const el = document.createElement('mmwave-3d-card');
    el.setConfig({ type: 'custom:mmwave-3d-card', ...CARDS[key], ...(q.get('view') ? { view: q.get('view') } : {}) });
    el.hass = hassFor();
    document.getElementById('cards').append(el);
    return el;
  });

  function push() {
    const hass = hassFor();
    cards.forEach((c) => { c.hass = hass; });
    if (editor) editor.hass = hass;
  }

  // Editor for the first card, as HA would mount it.
  let editor = null;
  const first = cards[0];
  let firstConfig = { type: 'custom:mmwave-3d-card', ...CARDS[(q.get('cards') ?? 'ld2450').split(',')[0]] };
  editor = first.constructor.getConfigElement();
  editor.hass = hassFor();
  editor.setConfig(firstConfig);
  const yaml = document.getElementById('yaml');
  const showYaml = () => { yaml.textContent = JSON.stringify(firstConfig, null, 2); };
  editor.addEventListener('config-changed', (e) => {
    firstConfig = e.detail.config;
    first.setConfig(firstConfig);
    first.hass = hassFor();
    editor.setConfig(firstConfig);
    showYaml();
  });
  document.getElementById('editor').append(editor);
  showYaml();

  const toast = document.getElementById('toast');
  document.addEventListener('hass-more-info', (e) => {
    moreInfo.push(e.detail.entityId);
    toast.textContent = `More info: ${e.detail.entityId}`;
    toast.dataset.on = 'true';
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { toast.dataset.on = 'false'; }, 1800);
  });

  const apply = () => {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    push();
  };

  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (playing) sim.advance((now - last) / 1000);
    last = now;
    push();
  }, 100);

  document.getElementById('theme').onclick = () => { dark = !dark; apply(); };
  document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'es' : 'en'; apply(); };
  document.getElementById('pause').onclick = (e) => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
  window.demo = { sim, cards, calls, moreInfo, editor, push, setPlaying: (v) => { playing = v; } };
</script>
</body>
</html>
